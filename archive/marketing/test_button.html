<!DOCTYPE html>
<html>
<head>
    <title>Button Color Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 4px;

            background-color: gray;

        }

    <button class="button">Click Me</button>
