<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neo 3.0 Developer Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px}
.container{max-width:1400px;margin:0 auto}
.header{background:#fff;padding:30px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1);margin-bottom:30px}
h1{color:#333;margin-bottom:10px;font-size:28px}
.subtitle{color:#666;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;margin-top:20px}
.stat-card{background:#f5f5f5;padding:15px;border-radius:6px;text-align:center}
.stat-value{font-size:24px;font-weight:bold;color:#667eea;margin-bottom:5px}
.stat-label{font-size:12px;color:#999;text-transform:uppercase;letter-spacing:.5px}
.files-grid{display:grid;gap:20px;margin-top:20px}
.file-card{background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1);transition:all .2s}
.file-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.file-header{padding:20px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:start}
.file-name{font-size:16px;font-weight:600;color:#333}
.file-heat-badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.heat-hot{background:#ffebee;color:#c62828}
.heat-warm{background:#fff3e0;color:#e65100}
.heat-cool{background:#e8f5e9;color:#2e7d32}
.dev-item{padding:12px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f0f0f0;font-size:13px}
.dev-item:last-child{border-bottom:none}
.dev-name{font-weight:600;color:#333;min-width:80px}
.dev-intent{color:#666;flex:1;margin:0 15px}
.dev-region{color:#999;font-size:12px;font-family:monospace;background:#f5f5f5;padding:2px 6px;border-radius:3px}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>📊 Neo 3.0 Developer Coordination Dashboard</h1>
<p class="subtitle">Real-time coordination of developer intent and conflict detection</p>
<div class="stats">
<div class="stat-card"><div class="stat-value" id="stat-developers">0</div><div class="stat-label">Active Devs</div></div>
<div class="stat-card"><div class="stat-value" id="stat-files">0</div><div class="stat-label">Files Modified</div></div>
<div class="stat-card"><div class="stat-value" id="stat-conflicts">0</div><div class="stat-label">Conflicts</div></div>
</div>
</div>
<div class="files-grid" id="filesGrid">
<p style="padding:40px;text-align:center;color:#999">No active changes. Coordinate with other developers to see activity.</p>
</div>
</div>
<script>
let state={devs:{},files:{}};
function updateStats(){document.getElementById('stat-developers').textContent=Object.keys(state.devs).length;document.getElementById('stat-files').textContent=Object.keys(state.files).length;let conflicts=0;Object.values(state.files).forEach(f=>{if(f.devCount>1)conflicts++});document.getElementById('stat-conflicts').textContent=conflicts}
function renderFiles(){let grid=document.getElementById('filesGrid');if(Object.keys(state.files).length===0){grid.innerHTML='<p style="padding:40px;text-align:center;color:#999">No active changes.</p>';return}let html='';Object.entries(state.files).forEach(([file,data])=>{let heat=data.devCount>2?'heat-hot':data.devCount>1?'heat-warm':'heat-cool';let heatLabel=data.devCount>2?'Hot':data.devCount>1?'Warm':'Cool';html+=`<div class="file-card"><div class="file-header"><div class="file-name">📄 ${file}</div><div class="file-heat-badge ${heat}">${heatLabel}</div></div>`;data.entries.forEach(e=>{html+=`<div class="dev-item"><div class="dev-name">${e.dev}</div><div class="dev-intent">"${e.intent}"</div><div class="dev-region">${e.region||'—'}</div></div>`});html+='</div>'});grid.innerHTML=html}
function logActivity(dev,file,intent,region){if(!state.files[file]){state.files[file]={devCount:0,entries:[]}}if(!state.devs[dev]){state.devs[dev]=1}state.files[file].entries.push({dev,intent,region,ts:Date.now()});let devOnFile=[...new Set(state.files[file].entries.map(e=>e.dev))];state.files[file].devCount=devOnFile.length;updateStats();renderFiles()}
// Demo scenarios
function demo1(){logActivity('Alice','src/auth.py','Add OAuth2 support','authenticate()');setTimeout(()=>{logActivity('Bob','src/auth.py','Add JWT tokens','authenticate()')},1000)}
function demo2(){logActivity('Charlie','src/models.py','Refactor User model','User class');setTimeout(()=>{logActivity('David','src/models.py','Add password hashing','User.validate()')},1000)}
window.logActivity=logActivity;updateStats();renderFiles();
</script>
</body>
</html>
