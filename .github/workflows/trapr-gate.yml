# TrapR gate: every source file must carry a TrapR build reference before it reaches
# main, Extension. Generated by `trapr gate-workflow`; make "trapr-gate" a required status check.
#
# Optional secret TRAPR_DISPATCH_TOKEN: a fine-grained token on jaykrishna316/trapr-vaults with only
# "Actions: Read and write". With it, a pull request with unmarked files asks the private sync to mark
# them right away; without it, the scheduled sync does it. It cannot read the vaults repo's files.
name: trapr-gate
on:
  pull_request:
    branches: [main, Extension]
  push:
    branches: [main, Extension]

permissions:
  contents: read

jobs:
  trapr-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check build references
        id: check
        env:
          TRAPR_GATE: '{"ptag":"12d07a5e","include":[".claude",".vscode/neo-activity-monitor"],"ext":[".c",".cjs",".cpp",".cs",".dart",".go",".h",".hpp",".java",".js",".jsx",".kt",".lua",".mjs",".php",".pl",".py",".r",".rb",".rs",".scala",".sh",".sql",".swift",".ts",".tsx"],"skip":[".git",".idea",".mypy_cache",".next",".pytest_cache",".tox",".venv",".vscode","__pycache__","build","coverage","dist","env","node_modules","site-packages","target","vendor","venv"]}'
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys
          cfg = json.loads(os.environ["TRAPR_GATE"])
          inc = [i.strip("/") for i in cfg["include"]]
          skip = set(cfg["skip"])
          def wanted(path):
              parts = path.split("/")
              if os.path.splitext(path)[1].lower() not in cfg["ext"]:
                  return False
              for i in inc:
                  if path.startswith(i + "/"):
                      return not any(x in skip for x in path[len(i) + 1:].split("/")[:-1])
              return not any(x in skip or (x.startswith(".") and x != ".github") for x in parts[:-1])
          files = [f for f in subprocess.run(["git", "ls-files", "-z"], capture_output=True, text=True,
                                             check=True).stdout.split("\0") if f and wanted(f)]
          mark = re.compile(r"\b" + cfg["ptag"] + r"-[0-9a-f]{8}\b")
          missing = [f for f in files if os.path.isfile(f) and not mark.search(open(f, encoding="utf-8", errors="replace").read())]
          with open(os.environ.get("GITHUB_OUTPUT", os.devnull), "a") as out:
              out.write(f"missing={len(missing)}\n")
          print(f"{len(files) - len(missing)}/{len(files)} source files carry a TrapR build reference.")
          for f in missing:
              print(f"::warning file={f}::no TrapR build reference yet")
          PY
      - name: Ask the private sync to mark this pull request
        if: ${{ steps.check.outputs.missing != '0' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true   # a failed request still leaves the scheduled sync; the next step fails the check anyway
        env:
          GH_TOKEN: ${{ secrets.TRAPR_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "No TRAPR_DISPATCH_TOKEN; the scheduled sync will mark it."; exit 0; fi
          ref=$(gh api repos/jaykrishna316/trapr-vaults --jq .default_branch) || { echo "::warning::TRAPR_DISPATCH_TOKEN can't see jaykrishna316/trapr-vaults. Give it access to that repo with Actions: Read and write."; exit 1; }
          gh api -X POST repos/jaykrishna316/trapr-vaults/actions/workflows/trapr-sync.yml/dispatches -f ref="$ref" -f "inputs[pr]=${{ github.event.pull_request.number }}" -f "inputs[repo]=${{ github.repository }}"
          echo "Asked jaykrishna316/trapr-vaults to mark this pull request."
      - name: After a push, ask the private sync to mark new files and update the vault
        if: ${{ github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Add TrapR build references') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.TRAPR_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "No TRAPR_DISPATCH_TOKEN; the scheduled sync will do it."; exit 0; fi
          ref=$(gh api repos/jaykrishna316/trapr-vaults --jq .default_branch) || { echo "::warning::TRAPR_DISPATCH_TOKEN can't see jaykrishna316/trapr-vaults. Give it access to that repo with Actions: Read and write."; exit 1; }
          gh api -X POST repos/jaykrishna316/trapr-vaults/actions/workflows/trapr-sync.yml/dispatches -f ref="$ref" -f "inputs[repo]=${{ github.repository }}"
          echo "Asked jaykrishna316/trapr-vaults to sync this repo."
      - name: Fail until every file is marked
        if: ${{ always() && steps.check.outputs.missing != '0' }}
        run: |
          echo "::error::${{ steps.check.outputs.missing }} file(s) have no TrapR build reference yet. TrapR's sync adds them with a comment-only commit; this check re-runs on that push."
          exit 1

