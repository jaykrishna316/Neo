name: "Neo: Semantic Developer Coordination Engine"

description: >
  Eliminate Git merge conflicts by coordinating developers at the semantic layer —
  preventing conflicts BEFORE they reach Git. Zero conflicts guaranteed in
  multi-developer AI workflows with 98-99% token savings.

icon: "🔒"

category: "development-tools"

tags:
  - "mcp"
  - "conflict-detection"
  - "multi-developer"
  - "coordination"
  - "semantic"
  - "activity-logging"
  - "lock-management"
  - "ai-agents"
  - "code-generation"
  - "merge-conflicts"

homepage: "https://github.com/jaykrishna316/Neo"
repository: "https://github.com/jaykrishna316/Neo"
documentation: "https://github.com/jaykrishna316/Neo#readme"
issues: "https://github.com/jaykrishna316/Neo/issues"
discussions: "https://github.com/jaykrishna316/Neo/discussions"

license: "MIT"

author: "Jay Krishna"
author_url: "https://github.com/jaykrishna316"

version: "1.0.0"

requirements:
  python: ">=3.8"
  mcp: ">=0.1.0"

installation:
  method: "mcp"
  marketplace: true
  manual: true

features:
  - name: "Semantic Conflict Detection"
    description: "Detect conflicts at intent layer BEFORE code generation. Returns LOW/MEDIUM/HIGH risk level."

  - name: "Automatic Lock State Machine"
    description: "ACQUIRED → WAITING → RELEASED → PROMOTED. Developers queue automatically, promoted when safe."

  - name: "Source Staleness Detection (C1)"
    description: "Symbol-level hashing verifies fresh context. Zero stale dependencies, instant verification."

  - name: "Delta Refresh (C2)"
    description: "Send only changed symbols instead of full file. 96% token reduction per refresh."

  - name: "Activity Log Audit Trail"
    description: "Complete JSON log of all coordination. Who worked on what, when, lock states, queue positions."

  - name: "Zero Merge Conflicts"
    description: "Semantic coordination prevents conflicts before Git merge. No manual resolution needed."

  - name: "98-99% Token Savings"
    description: "No expensive context re-reads during conflict resolution. Real measurements from production tests."

  - name: "Multitenancy Support"
    description: "Team isolation with separate activity logs per tenant. Support for multiple teams."

  - name: "Works with Any Agent"
    description: "Claude Code, Devin, custom agents - all coordinate through Neo via MCP."

  - name: "No External Dependencies"
    description: "Activity log is just JSON in .devsync/. No database, no cloud calls, fully local."

performance:
  conflict_detection_latency_ms:
    min: 0.08
    max: 0.22
    description: "Sub-millisecond conflict detection"

  activity_log_throughput:
    value: 6600
    unit: "writes/sec"
    description: "Production-ready throughput"

  token_savings_percent:
    average: 98.82
    min: 98.96
    max: 99.57
    description: "Measured across real scenarios"

  max_concurrent_developers: 16
  per_developer_overhead_ms: 0.37

mcp_tools:
  - name: "neo_check_conflicts"
    description: "Check for conflicts before code generation"

  - name: "neo_log_activity"
    description: "Log developer intent and track lock states"

  - name: "neo_check_source_staleness"
    description: "Verify context freshness using C1 symbol-level hashing"

  - name: "neo_get_active_work"
    description: "View all active developers and queue state"

  - name: "neo_get_status"
    description: "Check server status and version"

compatible_with:
  - "Claude Code"
  - "Claude IDE"
  - "Devin (via HTTP bridge)"
  - "Custom agents (via adapter pattern)"

platforms:
  - "macOS"
  - "Linux"
  - "Windows"

status: "Production Ready"
maintained: true
license_type: "MIT (Open Source)"
